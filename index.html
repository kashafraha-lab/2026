const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>parseFloat(v)||0,fmt=n=>n.toLocaleString('en-US',{maximumFractionDigits:2});
const calc=t=>{const b=num(t.buyPrice),c=num(t.chargePrice),s=num(t.sellPrice),d=num(t.discount),f=s-s*d/100;return t.isHalf?(f-c)/2:f-c-b};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){toast('تعذر حفظ البيانات','e')}};
const hp=(m=15)=>{try{navigator.vibrate&&navigator.vibrate(m)}catch(e){}};
const open=id=>$(id).classList.add('on'),close=id=>$(id).classList.remove('on');
function toast(m,t='s'){const e=document.createElement('div');e.className='toast '+t;e.innerHTML=ic(t==='e'?'x':'check',16)+'<span></span>';e.lastChild.textContent=m;$('ts').appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),400)},2400)}
function ask(t,m,ok,cb,danger=1){$('aT').textContent=t;$('aM').textContent=m;const b=$('aOk');b.textContent=ok;b.className='btn '+(danger?'dg':'pr');askCb=cb;open('ask')}
$('aOk').onclick=()=>{close('ask');askCb&&askCb()};
const share=(text,title)=>navigator.share?navigator.share({title,text}).catch(()=>{}):navigator.clipboard.writeText(text).then(()=>toast('تم النسخ للحافظة','i')).catch(()=>toast('تعذر النسخ','e'));
const copy=v=>{if(!v||v==='-')return;navigator.clipboard.writeText(v).then(()=>toast('تم النسخ: '+v,'i')).catch(()=>toast('تعذر النسخ','e'))};

const SW=['#5b4bff','#0f9d6e','#0ea5e9','#e5395b','#e8960c','#d946ef','#14b8a6'];
let th;try{th=JSON.parse(localStorage.getItem(TK))}catch(e){}
const old=localStorage.getItem('theme');
th=th||{m:old==='dark'||old==='light'?old:'auto',a:SW[0]};
$('sw').innerHTML=SW.map(c=>`<button data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')+'<label><input type="color" id="cc"></label>';
function applyTheme(){const dark=th.m==='dark'||(th.m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
 document.documentElement.dataset.theme=dark?'dark':'light';document.documentElement.style.setProperty('--ac',th.a);
 document.querySelector('meta[name=theme-color]').content=dark?'#0a0b16':'#f2f3f8';
 document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===th.m));
 $('sw').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.c===th.a));$('cc').value=th.a;
 try{localStorage.setItem(TK,JSON.stringify(th))}catch(e){}}
$('seg').onclick=e=>{const b=e.target.closest('button');if(b){th.m=b.dataset.m;applyTheme()}};
$('sw').onclick=e=>{const b=e.target.closest('button');if(b){th.a=b.dataset.c;applyTheme()}};
$('cc').oninput=e=>{th.a=e.target.value;applyTheme()};
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',applyTheme)}catch(e){}

const pd=s=>{if(!s)return 0;const p=String(s).split('/');return p.length===3?new Date(p[2],p[1]-1,p[0]).getTime():new Date(s).getTime()||0};
const SO={asc:(a,b)=>String(a.t.name||'').localeCompare(String(b.t.name||''),'ar'),desc:(a,b)=>SO.asc(b,a),buyHigh:(a,b)=>num(b.t.buyPrice)-num(a.t.buyPrice),buyLow:(a,b)=>num(a.t.buyPrice)-num(b.t.buyPrice),doneFirst:(a,b)=>(!!b.t.done)-(!!a.t.done),pendingFirst:(a,b)=>(!!a.t.done)-(!!b.t.done),dateNew:(a,b)=>pd(b.t.date)-pd(a.t.date),dateOld:(a,b)=>pd(a.t.date)-pd(b.t.date)};

function stats(){let P=0,B=0,pe=0,dn=0,cn=0,bk=0;
 tx.forEach(t=>{if(t.cancelled)cn++;else{P+=calc(t);B+=num(t.buyPrice);t.done?dn++:pe++;if(t.bookingDate&&!t.done)bk++}});
 $('sP').textContent=fmt(P);$('sP').classList.toggle('neg',P<0);$('hE').textContent='من '+dn+' معاملة منفذة';
 $('sB').textContent=fmt(B);$('sN').textContent=pe;$('sD').textContent=dn;$('sC').textContent=cn;$('sK').textContent=bk;
 $('sub').textContent=tx.length+' معاملة، '+pe+' جارية'}

const card=({t,i},n)=>{const c=!!t.cancelled,col=/^#[0-9a-f]{6}$/i.test(t.rowColor||'')&&t.rowColor.toLowerCase()!=='#ffffff'?t.rowColor:'';
 const rc=col||(c?'var(--sub)':t.done?'var(--ok)':'var(--wn)'),k=`data-k="${i}"`;
 const pill=c?'<span class="pill gr">ملغية</span>':t.done?`<span class="pill ok">${ic('check',13)}تم البيع</span>`:`<span class="pill wn">${ic('clock',13)}جاري البيع</span>`;
 let m='';if(t.done||num(t.sellPrice)>0){const p=calc(t);m+=`<span class="tag ${p>=0?'g':'r'}">ربح ${fmt(p)}</span>`}
 if(num(t.buyPrice)>0)m+=`<span class="tag">شراء ${fmt(num(t.buyPrice))}</span>`;
 if(t.isHalf)m+='<span class="tag">بالنصف</span>';
 if(t.bookingDate&&!t.done)m+=`<span class="tag">${ic('cal',12)}${esc(t.bookingDate)}</span>`;
 const del=`<button class="ia d" data-a="del" ${k} aria-label="حذف">${ic('trash',18)}</button>`;
 const tools=c?del:`<button class="ia" data-a="edit" ${k} aria-label="تعديل">${ic('edit',18)}</button><button class="ia" data-a="share" ${k} aria-label="مشاركة">${ic('share',18)}</button>${del}`;
 const acts=c?`<button class="ab ac" data-a="rest" ${k}>${ic('undo',17)}تفعيل المعاملة</button>`:`<button class="ab${t.done?'':' ac'}" data-a="sale" ${k}>${t.done?ic('undo',17)+'تراجع عن البيع':ic('check',17)+'إتمام البيع'}</button><button class="ab" data-a="book" ${k}>${ic('cal',17)}${t.done?'منتهي':t.bookingDate?'تم الحجز':'حجز موعد'}</button>`;
 return `<div class="c${c?' x':''}" style="--rc:${rc}"><div class="ch"><button class="nb" data-a="color" ${k}>${n}</button><div class="nm" data-a="det" ${k}><b>${esc(t.name)||'-'}</b><small>${[t.phone,t.date].filter(Boolean).map(esc).map(s=>`<span>${s}</span>`).join('')}</small></div>${tools}</div><div class="cm">${pill}${m}</div><div class="ca">${acts}</div></div>`};

function render(){
 const q=$('q').value.trim().toLowerCase();
 const rows=tx.map((t,i)=>({t,i})).filter(({t})=>!q||String(t.name||'').toLowerCase().includes(q)||String(t.phone||'').includes(q));
 const FL={all:()=>1,pending:r=>!r.t.done,done:r=>r.t.done,booked:r=>r.t.bookingDate&&!r.t.done};
 let a=rows.filter(r=>!r.t.cancelled),c=rows.filter(r=>r.t.cancelled);
 if(flt==='cancelled')a=[];else{a=a.filter(FL[flt]);if(flt!=='all')c=[]}
 if(SO[sortBy]){a.sort(SO[sortBy]);c.sort(SO[sortBy])}
 let n=0,h=a.map(r=>card(r,++n)).join('');
 if(c.length)h+=(a.length?'<div class="dv">المعاملات الملغية</div>':'')+c.map(r=>card(r,++n)).join('');
 $('list').innerHTML=h||`<div class="em">${ic('inbox',44)}<p>${tx.length?'لا توجد نتائج مطابقة':'لا توجد معاملات بعد.<br>اضغط «معاملة جديدة» للبدء'}</p></div>`;
 stats()}
$('q').oninput=render;
$('so').onchange=e=>{sortBy=e.target.value;render()};
$('fl').onclick=e=>{const b=e.target.closest('button');if(!b)return;flt=b.dataset.f;[...$('fl').children].forEach(x=>x.classList.toggle('on',x===b));render()};

const F=['name','phone','account','nationalId','passport','iban','buyPrice','chargePrice','sellPrice','discount'];
const fh=()=>{$('f_buyPrice').disabled=$('f_half').checked};
function form(i=-1){edit=i;const t=i>-1?tx[i]:{};
 F.forEach(k=>$('f_'+k).value=k==='discount'?(t.discount||'0'):(t[k]??''));$('f_half').checked=!!t.isHalf;fh();
 $('fT').textContent=i>-1?'تعديل المعاملة':'معاملة جديدة';$('fSave').innerHTML=ic('check')+(i>-1?'تحديث المعاملة':'حفظ المعاملة');
 $('fCan').style.display=i>-1?'':'none';if(i>-1)$('fCan').innerHTML=ic(t.cancelled?'undo':'ban')+(t.cancelled?'تفعيل المعاملة':'إلغاء المعاملة');open('form')}
$('bAdd').onclick=()=>{hp();form()};
$('f_half').onchange=fh;
$('fSave').onclick=()=>{hp(30);const v=k=>$('f_'+k).value;if(!v('name').trim()){toast('الاسم مطلوب!','e');return}
 const o=edit>-1?tx[edit]:null;let done=o?!!o.done:false;if(parseFloat(v('sellPrice'))>0)done=true;
 const d={...(o||{}),...Object.fromEntries(F.map(k=>[k,k==='name'?v(k).trim():v(k)])),isHalf:$('f_half').checked,date:o?o.date:new Date().toLocaleDateString('en-GB'),rowColor:o?(o.rowColor||'#ffffff'):'#ffffff',done,cancelled:o?!!o.cancelled:false,bookingDate:o?(o.bookingDate||''):''};
 if(o)tx[edit]=d;else tx.push(d);save();close('form');render();toast(o?'تم تحديث البيانات':'تم الحفظ بنجاح')};
$('fCan').onclick=()=>{const t=tx[edit];if(!t)return;
 ask(t.cancelled?'تفعيل المعاملة':'إلغاء المعاملة','هل أنت متأكد من تغيير حالة المعاملة؟','نعم، متأكد',()=>{t.cancelled=!t.cancelled;save();close('form');render();toast(t.cancelled?'تم إلغاء المعاملة':'تم تفعيل المعاملة')},!t.cancelled)};

function sale(i){cur=i;const t=tx[i],q=$('qe_in'),em=v=>v===undefined||v===null||v==='';
 q.disabled=false;q.value='';$('qe_g').style.opacity=1;$('qe_half').checked=false;
 if(!t.isHalf&&em(t.buyPrice)){step='buy';$('qe_t').textContent='شراء البطاقة';q.placeholder='سعر الشراء (أو اتركه فارغاً)';$('qe_hf').style.display='flex'}
 else if(em(t.chargePrice)){step='charge';$('qe_t').textContent='قيمة الشحن';q.placeholder='قيمة الشحن (أو اتركه فارغاً)';$('qe_hf').style.display='none'}
 else{step='sell';$('qe_t').textContent='إتمام البيع';q.placeholder='أدخل سعر البيع';$('qe_hf').style.display='none'}
 open('qe');setTimeout(()=>q.focus(),300)}
$('qe_half').onchange=()=>{const h=$('qe_half').checked;$('qe_in').disabled=h;$('qe_g').style.opacity=h?.3:1};
$('qe_ok').onclick=()=>{const v=$('qe_in').value,h=$('qe_half').checked,t=tx[cur];if(!t)return;
 if(step==='buy'&&h){t.isHalf=true;t.buyPrice='';save();close('qe');setTimeout(()=>sale(cur),250);return}
 if(step==='buy'){t.buyPrice=v||'0';t.isHalf=false}
 else if(step==='charge')t.chargePrice=v||'0';
 else{if(!(parseFloat(v)>0)){toast('أدخل رقماً صحيحاً لإتمام البيع','e');return}t.sellPrice=v;t.done=true}
 save();close('qe');
 if(step!=='sell')setTimeout(()=>sale(cur),250);else{toast('تم إتمام البيع وتحديث البيانات');render()}};

function details(i){cur=i;const t=tx[i];$('dN').textContent=t.name||'تفاصيل المعاملة';
 $('dI').innerHTML=[['رقم الهاتف','phone'],['الحساب','account'],['الرقم الوطني','nationalId'],['جواز السفر','passport'],['تاريخ الإضافة','date'],['IBAN','iban']].map(([l,k])=>{const v=t[k]||'-';return `<button class="ii" data-cp="${esc(v)}"><small>${l}</small><b>${esc(v)}</b></button>`}).join('');
 $('d_buy').value=t.buyPrice||'';$('d_charge').value=t.chargePrice||'';$('d_sell').value=t.sellPrice||'';$('d_disc').value=t.discount||'0';$('d_half').checked=!!t.isHalf;dh();open('det')}
function dp(){if(cur<0)return;const b=num($('d_buy').value),c=num($('d_charge').value),s=num($('d_sell').value),d=num($('d_disc').value),f=s-s*d/100,p=$('d_half').checked?(f-c)/2:f-c-b;
 $('dP').textContent=p.toFixed(2);$('dPc').style.background=p>=0?'var(--ok)':'var(--no)'}
function dh(){$('d_buy').disabled=$('d_half').checked;dp()}
['d_buy','d_charge','d_sell','d_disc'].forEach(k=>$(k).oninput=dp);$('d_half').onchange=dh;
$('dSave').onclick=()=>{const t=tx[cur];if(!t)return;t.buyPrice=$('d_buy').value;t.chargePrice=$('d_charge').value;t.sellPrice=$('d_sell').value;t.discount=$('d_disc').value;t.isHalf=$('d_half').checked;
 if(parseFloat(t.sellPrice)>0)t.done=true;save();render();toast('تم حفظ التعديلات بنجاح');close('det')};

function book(i){cur=i;$('bk_d').value=tx[i].bookingDate||'';$('bk_c').style.display=tx[i].bookingDate?'':'none';open('bk')}
$('bk_s').onclick=()=>{if(cur>-1){tx[cur].bookingDate=$('bk_d').value;save();toast('تم حفظ التاريخ بنجاح');close('bk');render()}};
$('bk_c').onclick=()=>{if(cur>-1){tx[cur].bookingDate='';save();toast('تم إلغاء الحجز بنجاح','i');close('bk');render()}};

function del(i){ask('تأكيد الحذف','هل تريد حذف «'+(tx[i].name||'')+'» نهائياً؟','حذف',()=>{tx.splice(i,1);save();render();toast('تم الحذف بنجاح','e')})}
function restore(i){ask('تفعيل المعاملة','هل أنت متأكد من تفعيل هذه المعاملة؟','نعم، تفعيل',()=>{tx[i].cancelled=false;save();close('ls');render();toast('تم تفعيل المعاملة بنجاح')},0)}
function shareTx(i){const t=tx[i];share(`الاسم: ${t.name}\nتليفون: ${t.phone||'-'}\nحساب: ${t.account||'-'}\nجواز السفر: ${t.passport||'-'}`,'بيانات العميل')}
function pick(i){cur=i;const c=tx[i].rowColor;$('pk').value=/^#[0-9a-f]{6}$/i.test(c||'')?c:th.a;$('pk').click()}
$('pk').onchange=e=>{if(cur>-1&&tx[cur]){tx[cur].rowColor=e.target.value;save();render()}};

$('list').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const i=+b.dataset.k;hp(12);
 ({det:()=>details(i),edit:()=>form(i),share:()=>shareTx(i),del:()=>del(i),rest:()=>restore(i),book:()=>book(i),color:()=>pick(i),
 sale:()=>{if(tx[i].done){tx[i].done=false;save();render()}else sale(i)}})[b.dataset.a]()};

const LT={profit:'قائمة الأرباح',purchases:'قائمة المشتريات',pending:'المعاملات الجارية',done:'المعاملات المنفذة',cancelled:'المعاملات الملغية',booked:'قائمة الحجوزات'};
function showList(type){hp(15);
 const rows=tx.map((t,i)=>({t,i})).filter(({t})=>{if(t.cancelled&&type!=='cancelled')return false;
  switch(type){case'profit':return calc(t)>0;case'purchases':return num(t.buyPrice)>0;case'pending':return !t.done;case'done':return !!t.done;case'cancelled':return !!t.cancelled;case'booked':return t.bookingDate&&!t.done}return false});
 let txt=LT[type]+'\n\n';$('lT').textContent=LT[type];
 $('lB').innerHTML=rows.length?rows.map(({t,i},k)=>{let inf='',pl='';
  if(type==='profit'){const p=calc(t);inf=`<b class="g">+${fmt(p)}</b>`;pl='الربح: '+fmt(p)}
  else if(type==='purchases'){pl='شراء: '+fmt(num(t.buyPrice));inf=pl}
  else if(type==='booked'){pl='موعد: '+t.bookingDate;inf=esc(t.bookingDate)}
  else if(type==='cancelled'){pl='ملغية';inf=`<button class="mini" data-r="${i}">استرجاع</button>`}
  txt+=`${k+1}- ${t.name}${pl?' ('+pl+')':''}\n`;
  return `<div class="lr"><span class="ln">${k+1}</span><b>${esc(t.name)}</b><span>${inf}</span></div>`}).join(''):'<div class="em">لا توجد بيانات مطابقة</div>';
 if(!rows.length)txt+='لا توجد بيانات مطابقة';shareTxt=txt;open('ls')}
$('lB').onclick=e=>{const b=e.target.closest('[data-r]');if(b)restore(+b.dataset.r)};
$('lS').onclick=()=>{hp(30);share(shareTxt,$('lT').textContent)};

$('bPv').onclick=()=>{const on=$('list').classList.toggle('pv');$('bPv').innerHTML=ic(on?'eyeoff':'eye');toast(on?'تم إخفاء البيانات':'تم إظهار البيانات','i')};
$('bSet').onclick=()=>open('set');
$('bEx').onclick=()=>{if(typeof XLSX==='undefined'){toast('مكتبة Excel غير متاحة، تحقق من الاتصال','e');return}
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(tx),'2026');XLSX.writeFile(wb,'Transactions_2026.xlsx');toast('تم تصدير الملف')};
$('bIm').onclick=()=>$('fi').click();
$('fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 if(typeof XLSX==='undefined'){toast('مكتبة Excel غير متاحة، تحقق من الاتصال','e');return}
 const r=new FileReader();r.onload=ev=>{try{
  const rows=XLSX.utils.sheet_to_json(XLSX.read(new Uint8Array(ev.target.result),{type:'array'}).Sheets[XLSX.read(new Uint8Array(ev.target.result),{type:'array'}).SheetNames[0]]);
  if(!rows.length)throw 0;const bo=v=>v===true||v===1||/^(true|1)$/i.test(String(v));
  const data=rows.map(o=>({...o,done:bo(o.done),cancelled:bo(o.cancelled),isHalf:bo(o.isHalf),bookingDate:o.bookingDate||'',rowColor:o.rowColor||'#ffffff'}));
  close('set');ask('استيراد نسخة','سيتم استبدال البيانات الحالية بـ '+data.length+' معاملة من الملف.','استيراد',()=>{tx=data;save();render();toast('تم استيراد البيانات')},0)
 }catch(x){toast('الملف غير صالح','e')}};r.readAsArrayBuffer(f)};

document.addEventListener('click',e=>{
 const x=e.target.closest('[data-x]');if(x)close(x.dataset.x);
 const l=e.target.closest('[data-l]');if(l)showList(l.dataset.l);
 const p=e.target.closest('[data-cp]');if(p)copy(p.dataset.cp);
 if(e.target.classList.contains('bg'))e.target.classList.remove('on')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.bg.on').forEach(b=>b.classList.remove('on'))});

function checkN(){const today=new Date();today.setHours(0,0,0,0);const tm=new Date(today);tm.setDate(today.getDate()+1);let ch=false;
 tx.forEach(t=>{if(t.bookingDate){const b=new Date(t.bookingDate);b.setHours(0,0,0,0);
  if(b.getTime()===tm.getTime())toast('تنبيه: حجز '+t.name+' غداً!','i');else if(b.getTime()<today.getTime()){t.bookingDate='';ch=true}}});
 if(ch){save();render()}}

applyTheme();render();checkN();
</script>
</body>
